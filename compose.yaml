# Local development services. Start with:  docker compose up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind-postgres
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs AI models locally for free. Step 4 uses its embedding model (nomic-embed-text).
  ollama:
    image: ollama/ollama:latest
    container_name: documind-ollama
    ports:
      - "11434:11434"
    volumes:
      # Downloaded models are kept here, so they survive restarts.
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data: