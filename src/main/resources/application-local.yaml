# Local development: Postgres and Ollama started by compose.yaml.
# Defaults match compose.yaml; override any of them with environment variables.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:documind}
    username: ${DB_USER:documind}
    password: ${DB_PASSWORD:documind}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        # 768-dimension embedding model; small enough to run on a laptop CPU.
        model: nomic-embed-text
      chat:
        # Small chat model that runs on a laptop without a graphics card (about 2 GB).
        # Faster but weaker: llama3.2:1b. Stronger but slower: qwen2.5:7b or llama3.1:8b.
        model: llama3.2:3b
        # Low temperature: stick closely to the passages instead of being creative.
        temperature: 0.2
        # Room for rules + 10 earlier messages + 5 passages + the answer.
        # Ollama's default is smaller and would silently cut the prompt.
        num-ctx: 8192
      init:
        # Downloads missing models on first start (chat ~2 GB, embedding ~275 MB).
        pull-model-strategy: when_missing
        # The default 5 minutes is too short to download 2 GB on a slow connection.
        timeout: 30m

documind:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-secret-not-for-production-0123456789}
    cookie-secure: false

logging:
  level:
    com.backend.documind: DEBUG